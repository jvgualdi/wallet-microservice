spring:
  application:
    name: wallet-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DATASOURCE_USERNAME:user_payment}
    password: ${DATASOURCE_PASSWORD:A!bC3}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: payment

